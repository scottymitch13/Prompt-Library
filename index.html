function renderHotkeys(){let q=document.getElementById('search').value.toLowerCase().trim(),app=document.getElementById('filter').value,groups=new Map(),shown=0,total=0;hotkeys.forEach(x=>{total+=x.rows.length;if(app&& !x.app.startsWith(app))return;let rows=x.rows.filter(r=>matches(`${x.app} ${x.cat} ${r[0]} ${r[1]}`,q));if(rows.length){shown+=rows.length;if(!groups.has(x.app))groups.set(x.app,[]);groups.get(x.app).push({...x,rows})}});let out='',i=0;groups.forEach((items,name)=>{let inside=items.map(x=>`<details class="subgroup" ${q?'open':''}><summary>${esc(x.cat)}</summary><div class="rows">${x.rows.map(r=>`<div class="row"><div class="keys"><span class="key">${esc(r[0])}</span></div><div class="action">${esc(r[1])}</div><div class="status">Current</div><button class="copy" data-copy="${esc(r[0])}" title="Copy shortcut">⧉</button></div>`).join('')}</div></details>`).join('');out+=`<details class="group" ${q||i===0?'open':''}><summary>${esc(name)}</summary>${inside}</details>`;i++});document.getElementById('hotkeyContent').innerHTML=out||'<div class="empty">No hotkeys match that search.</div>';document.getElementById('count').textContent=q?`${shown} matching hotkeys`:`${total} hotkeys`;bindCopy();renderSources()}
let promptVaultLoaded=false;function renderPrompts(){document.getElementById('count').textContent='Prompt Vault';let container=document.getElementById('prompts');if(!promptVaultLoaded){promptVaultLoaded=true;container.innerHTML='<div class="empty">Loading prompt vault…</div>';let parts=['vault/part-00.txt','vault/part-01.txt','vault/part-02.txt','vault/part-03.txt','vault/part-04.txt','vault/part-05.txt','vault/part-06.txt'];Promise.all(parts.map(p=>fetch(p).then(r=>r.text()))).then(chunks=>{let html=chunks.join('');let iframe=document.createElement('iframe');iframe.className='vault-frame';iframe.srcdoc=html;container.innerHTML='';container.appendChild(iframe)}).catch(e=>{container.innerHTML='<div class="empty">Failed to load prompt vault: '+String(e&&e.message||e)+'</div>'})}}
function renderSources(){let q=document.getElementById('search').value.toLowerCase().trim(),a=sources.filter(s=>matches(s.join(' '),q));document.getElementById('sourceContent').innerHTML=a.length?a.map(s=>`<article class="source-card"><div class="source-name">${esc(s[0])}</div><span class="badge">${esc(s[2])}</span><div class="source-path">${esc(s[1])}<br>${esc(s[3])}</div></article>`).join(''):'<div class="empty">No sources match that search.</div>';document.getElementById('sourcesCount').textContent=`(${a.length})`}
function bindCopy(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy);let old=b.textContent;b.textContent='✓';setTimeout(()=>b.textContent=old,900)})}function active(){let v=document.querySelector('.tab.active').dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==v));v==='hotkeys'?renderHotkeys():renderPrompts()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active()});document.getElementById('search').oninput=active;document.getElementById('filter').onchange=renderHotkeys;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('filter').value=b.dataset.app.split(' / ')[0]||'';document.getElementById('search').value=b.dataset.app.split(' / ').pop()==='All hotkeys'?'':b.dataset.app.split(' / ').pop();renderHotkeys()});document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);active();
