<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Vault</title>
    <style>
/* ============================================================
   PROMPT VAULT — Design System
   Palette: Deep navy workspace + amber accent + slate surfaces
   Typography: Georgia (display) + system-ui (body)
   Aesthetic: Technical reference manual meets executive notebook
   ============================================================ */

:root {
  --bg:          #0f1117;
  --bg-2:        #171b26;
  --bg-3:        #1e2333;
  --surface:     #252b3b;
  --surface-2:   #2e3547;
  --border:      #333d54;
  --border-2:    #404d68;

  --amber:       #e8a020;
  --amber-dim:   #c4861a;
  --amber-glow:  rgba(232,160,32,0.12);
  --amber-glow2: rgba(232,160,32,0.06);

  --text-primary:   #e8ecf4;
  --text-secondary: #8b96b0;
  --text-muted:     #5a6480;
  --text-amber:     #e8a020;

  --tag-automation:    #1a3a4a;
  --tag-automation-t:  #4db8d4;
  --tag-troubleshoot:  #3a1a1a;
  --tag-troubleshoot-t:#d47a4d;
  --tag-strategy:      #1a2a3a;
  --tag-strategy-t:    #6a9fd4;
  --tag-technical:     #2a1a3a;
  --tag-technical-t:   #a06ad4;
  --tag-process:       #1a3a2a;
  --tag-process-t:     #4dd4a0;
  --tag-planning:      #3a2a1a;
  --tag-planning-t:    #d4b04d;
  --tag-productivity:  #2a3a1a;
  --tag-productivity-t:#8dd44d;
  --tag-foundation:    #2a2a1a;
  --tag-foundation-t:  #d4d44d;

  --sidebar-w: 280px;
  --topbar-h:  56px;
  --radius:    6px;
  --radius-lg: 10px;
  --transition: 0.18s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width var(--transition), min-width var(--transition);
  overflow: hidden;
  z-index: 100;
}

.sidebar.collapsed {
  width: 0;
  min-width: 0;
  border-right-color: transparent;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  color: var(--amber);
  font-size: 1.1rem;
  line-height: 1;
}

.logo-text {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-primary);
  white-space: nowrap;
}

.sidebar-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
  flex-shrink: 0;
}
.sidebar-toggle:hover { background: var(--surface); color: var(--text-primary); }

/* Search */
.search-wrap {
  padding: 12px 14px;
  position: relative;
  flex-shrink: 0;
}
.search-wrap input {
  width: 100%;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 0.85rem;
  padding: 7px 32px 7px 10px;
  outline: none;
  transition: border-color var(--transition);
}
.search-wrap input:focus { border-color: var(--amber); }
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85rem;
  pointer-events: none;
}

/* Nav */
.prompt-nav {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--transition);
  border: 1px solid transparent;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface); }
.nav-item.active {
  background: var(--amber-glow);
  border-color: rgba(232,160,32,0.25);
}

.nav-num {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text-muted);
  width: 20px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.nav-item.active .nav-num { color: var(--amber); }

.nav-label {
  font-size: 0.84rem;
  color: var(--text-secondary);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-item.active .nav-label { color: var(--text-primary); }

.nav-item.hidden { display: none; }

/* Sidebar footer */
.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.btn-reset {
  width: 100%;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.8rem;
  padding: 7px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-reset:hover { border-color: var(--border-2); color: var(--text-secondary); background: var(--surface); }

/* ============================================================
   MAIN
   ============================================================ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Top bar */
.top-bar {
  height: var(--topbar-h);
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  flex-shrink: 0;
}

.hamburger {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.hamburger:hover { background: var(--surface); color: var(--text-primary); }

.top-bar-title {
  font-family: Georgia, serif;
  font-size: 0.95rem;
  color: var(--text-secondary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-bar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.save-indicator {
  font-size: 0.75rem;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity 0.3s;
}
.save-indicator.visible { opacity: 1; }

.btn-copy-all {
  background: var(--amber);
  border: none;
  color: #0f1117;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background var(--transition);
  letter-spacing: 0.02em;
}
.btn-copy-all:hover { background: var(--amber-dim); }
.btn-copy-all.hidden { display: none; }

/* ============================================================
   WELCOME SCREEN
   ============================================================ */
.welcome-screen {
  flex: 1;
  overflow-y: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 32px;
}

.welcome-inner {
  max-width: 720px;
  width: 100%;
  text-align: center;
}

.welcome-diamond {
  color: var(--amber);
  font-size: 2.5rem;
  margin-bottom: 16px;
  display: block;
}

.welcome-inner h1 {
  font-family: Georgia, serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}

.welcome-inner p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 36px;
}

.welcome-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  text-align: left;
}

.welcome-card {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  cursor: pointer;
  transition: all var(--transition);
}
.welcome-card:hover {
  border-color: var(--amber);
  background: var(--amber-glow2);
  transform: translateY(-1px);
}

.wc-tag {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 5px;
}

.wc-title {
  font-size: 0.85rem;
  color: var(--text-primary);
  font-weight: 600;
  line-height: 1.3;
}

/* ============================================================
   PROMPT VIEW
   ============================================================ */
.prompt-view {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px 80px;
}

.prompt-meta {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.prompt-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 3px;
  margin-bottom: 10px;
}

/* Tag color variants */
.tag-automation    { background: var(--tag-automation);    color: var(--tag-automation-t); }
.tag-troubleshoot  { background: var(--tag-troubleshoot);  color: var(--tag-troubleshoot-t); }
.tag-strategy      { background: var(--tag-strategy);      color: var(--tag-strategy-t); }
.tag-technical     { background: var(--tag-technical);     color: var(--tag-technical-t); }
.tag-process       { background: var(--tag-process);       color: var(--tag-process-t); }
.tag-planning      { background: var(--tag-planning);      color: var(--tag-planning-t); }
.tag-productivity  { background: var(--tag-productivity);  color: var(--tag-productivity-t); }
.tag-foundation    { background: var(--tag-foundation);    color: var(--tag-foundation-t); }

.prompt-title {
  font-family: Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.25;
}

.prompt-subtitle {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.55;
  max-width: 600px;
}

/* Editor area */
.editor-area {
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Prompt block: a labeled section */
.prompt-block {
  margin-bottom: 0;
}

/* Static text block (intro, instructions) */
.block-static {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 16px 20px;
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.65;
  white-space: pre-wrap;
  font-family: Georgia, serif;
  font-style: italic;
}

.block-static + .block-static {
  border-top: none;
  border-radius: 0;
}

/* Step header */
.step-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.step-header:first-child {
  border-top: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.step-label {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--amber);
  white-space: nowrap;
}

.step-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}

/* Editable textarea */
.block-editable {
  position: relative;
  border: 1px solid var(--border);
  border-top: none;
}

.block-editable:last-child {
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

.block-editable textarea {
  width: 100%;
  background: var(--bg-3);
  border: none;
  color: var(--text-primary);
  font-size: 0.875rem;
  line-height: 1.7;
  padding: 14px 20px 36px;
  resize: none;
  outline: none;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 80px;
  transition: background var(--transition);
  overflow: hidden;
}

.block-editable textarea:focus {
  background: var(--surface);
}

.block-editable textarea.is-placeholder {
  color: var(--amber);
  font-style: italic;
}

/* Placeholder indicator tag */
.placeholder-tag {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--amber);
  background: var(--amber-glow);
  border: 1px solid rgba(232,160,32,0.2);
  padding: 2px 7px;
  border-radius: 3px;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--transition);
}

.block-editable:focus-within .placeholder-tag,
.block-editable textarea.is-placeholder ~ .placeholder-tag {
  opacity: 1;
}

/* Section divider between logical groups */
.section-divider {
  height: 20px;
}

/* Prompt actions bar */
.prompt-actions-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.btn-reset-single {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.8rem;
  padding: 8px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-reset-single:hover { border-color: var(--border-2); color: var(--text-secondary); background: var(--surface); }

.btn-copy-final {
  background: var(--amber);
  border: none;
  color: #0f1117;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 9px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background var(--transition);
  letter-spacing: 0.02em;
}
.btn-copy-final:hover { background: var(--amber-dim); }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--text-primary);
  font-size: 0.82rem;
  padding: 10px 20px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9000;
  backdrop-filter: blur(3px);
}

.modal {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  max-width: 380px;
  width: 90%;
}

.modal h3 {
  font-family: Georgia, serif;
  font-size: 1.1rem;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.modal p {
  font-size: 0.87rem;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 22px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn-cancel {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 0.85rem;
  padding: 8px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-cancel:hover { background: var(--surface); }

.btn-confirm {
  background: #c0392b;
  border: none;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--transition);
}
.btn-confirm:hover { background: #a93226; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 640px) {
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; }
  .sidebar.collapsed { transform: translateX(-100%); width: var(--sidebar-w); min-width: var(--sidebar-w); }
  .prompt-view { padding: 20px 18px 80px; }
  .welcome-screen { padding: 28px 16px; }
  .welcome-grid { grid-template-columns: 1fr 1fr; }
}


/* ── Comprehensive edition additions ── */
.nav-group {
  padding: 16px 12px 5px;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.nav-group.hidden { display: none; }

.explain-box {
  background: var(--amber-glow2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius);
  padding: 13px 16px;
  margin: 16px 0 0;
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--text-secondary);
}
.explain-label {
  display: block;
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  color: var(--amber);
  margin-bottom: 6px;
}

.welcome-group-label {
  grid-column: 1 / -1;
  text-align: left;
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--amber);
  margin-top: 16px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.tag-research { background: #14333c; color: #4ec6c6; }
.tag-verify   { background: #333018; color: #d3c44f; }

.welcome-screen { overflow-y: auto; align-items: flex-start; }
.welcome-inner { margin: 0 auto; padding-top: 40px; padding-bottom: 64px; }

/* Ask box: what do you want to do */
.ask-section { text-align: left; margin: 0 0 34px; }
.ask-label { display: block; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 1.12rem; color: var(--amber); margin-bottom: 10px; }
.ask-input { width: 100%; box-sizing: border-box; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: var(--radius-lg); color: var(--text-primary); font-size: 0.98rem; line-height: 1.5; padding: 13px 15px; outline: none; font-family: inherit; resize: none; }
.ask-input::placeholder { color: var(--text-muted); }
.ask-input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
.ask-results { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.ask-card { text-align: left; background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; cursor: pointer; transition: all var(--transition); font-family: inherit; color: inherit; display: block; width: 100%; }
.ask-card:hover { border-color: var(--amber); background: var(--surface); }
.ask-card.best { border-color: rgba(232,160,32,0.5); background: var(--amber-glow); }
.ask-card.best:hover { background: var(--surface); }
.ask-card-top { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
.ask-best-chip { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.08em; color: #0f1117; background: var(--amber); border-radius: 3px; padding: 2px 6px; }
.ask-group { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; }
.ask-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.ask-why { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.55; }
.ask-empty { margin-top: 12px; font-size: 0.88rem; color: var(--text-muted); font-style: italic; }
</style>
  </head>
  <body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">&#9670;</span>
          <span class="logo-text">Prompt Vault</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">&#8249;</button>
      </div>

      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search prompts..." autocomplete="off" />
        <span class="search-icon">&#9906;</span>
      </div>

      <nav class="prompt-nav" id="promptNav">
        <!-- Populated by JS -->
      </nav>

    explain: "The heavy research prompt. The AI researches, writes a draft you never see, attacks that draft like a well-informed skeptic who wants it to be wrong, then goes BACK OUT to research every objection that landed, and only then reports. Every source gets a date and a bias note, and claims the conclusion depends on need two independent sources. Only the first blank is required; the other three have working defaults built in. For quick everyday questions use Devil's Advocate instead; this one is for answers that feed real decisions.",

      { type: 'step', label: "GROUND RULES", title: "" },
      { type: 'editable', text: "1. Work the whole process before replying. One message containing the final result plus the audit trail, not a running commentary.\n2. Do not ask me clarifying questions. If something is ambiguous, pick the most useful interpretation, say which one you picked, and note what you would have asked.\n3. Every factual claim carries its source, the date of that source, and whether it is primary or secondary. Any claim the conclusion depends on needs two independent sources, or it gets labeled single-sourced.\n4. 'I could not determine this' is an acceptable and expected answer. Never fill a gap with something plausible. Label gaps explicitly and say what it would take to close them.\n5. Distinguish what the evidence says from what you infer from it. Mark inferences as inferences.\n6. Watch for stale information. If a fact has a shelf life, say when it was true and whether it likely still is.\n7. Note who benefits from each source being believed. Vendor material, advocacy groups, and press releases get discounted accordingly.", placeholder: false },
      { type: 'static', text: "Run these phases in order and label each one in your reply." },
      { type: 'step', label: "PHASE 1", title: "— FRAME" },
      { type: 'editable', text: "State the real question behind my request, the sub-questions that have to be answered to settle it, and what kind of evidence would actually be decisive. Name the question that, if you get it wrong, makes everything downstream wrong.", placeholder: false },

      { type: 'editable', text: "Go wide first, then deep on what matters. Cover the established position, the dissenting position, the current state of play, and the numbers if numbers apply. Track where sources contradict each other rather than silently picking a winner. Keep a running list of what you searched and what you could not find.", placeholder: false },
      { type: 'step', label: "PHASE 3", title: "— DRAFT FINDINGS" },
      { type: 'editable', text: "Write the findings you would have sent me if this prompt had stopped here. Be specific and committed, not hedged, so there is something real to attack. Do not show me this draft. Keep it internal and reference it in the phases below.", placeholder: false },
      { type: 'step', label: "PHASE 4", title: "— DEVIL'S ADVOCATE" },
      { type: 'editable', text: "Now switch sides. Your job is to destroy the Phase 3 draft, in good faith, as if a well-informed skeptic who wants you to be wrong is reviewing it. Work through at minimum:\n- The strongest case against your conclusion\n- Claims resting on weak, biased, single, stale, or circular sources\n- Where you generalized from too little, or from an unrepresentative case\n- Alternative explanations for the same evidence, including plain coincidence\n- Confounders, selection effects, missing base rates, and survivorship bias\n- What is conspicuously absent: the data nobody publishes, the counterexample you did not look for\n- Where you told me what I appear to want to hear\n- What would have to be true for your conclusion to hold, and how confident you actually are in each of those things\nThen steelman the opposing position: state the strongest honest version of it, held by the most competent person who disagrees. Not a weak version you can dismiss.\nRate every objection you raise: FATAL (the conclusion cannot stand), SERIOUS (it needs restructuring), or SURVIVED (the draft answers it, and here is how).", placeholder: false },

      { type: 'editable', text: "<identity>\nYou are [USER'S NAME]'s Chief of Staff. Not a chatbot. You cut through noise, run point on the work that matters, and never make them babysit you. Assume they are busy, smart, and will fire you if you waste their time.\n\nThey are a solo founder running [COMPANY NAME]. Their work is [brief description]. Their top priorities this quarter are [Priority 1], [Priority 2], [Priority 3].\n<\/identity>\n\n<gears>\nYou operate in one of four gears. They set it. You stay there until told otherwise.\n\nWATCH: Read-only. Observe, summarize, analyze. No drafts, no actions, no recommendations unless asked. For situational awareness, meeting prep, intel gathering.\n\nDRAFT (default): Prepare everything. Emails, plans, schedules, replies, decisions. Show the work, wait for the green light. Nothing leaves your hands without their nod.\n\nMOVE: Execute reversible actions immediately. Confirm irreversible ones first.\n- Reversible: drafts, internal notes, schedule blocks, in-system updates.\n- Irreversible: sending external email, paying, deleting, public posting, signing.\n\nOWN: Run end-to-end inside a stated scope. Report after, not before. Never expand scope on your own. Stop and surface if anything irreversible falls outside the scope.\n\nIf a request straddles gears, name the ambiguity in one line and propose the right gear.\n<\/gears>\n\n<operating_loop>\nFor every non-trivial request, run this loop silently:\n1. Read the intent. What do they actually want: capture, organize, decide, execute, or understand?\n2. Spot the trap. What is the obvious answer that is wrong? What is the second-order effect?\n3. Pick the play. Smallest correct action that moves them forward. Bias toward fewer decisions for them.\n4. Deliver. Lead with the answer. Reasoning second, only if it earns its place.\n5. Close the loop. If you committed to anything, surface it. If something is slipping, flag it.\n<\/operating_loop>\n\n<capabilities>\nInbox triage: Sort, summarize, draft replies in their voice, flag what needs them personally vs. what can wait.\n\nCalendar defense: Protect focus blocks, surface conflicts, draft agendas, prep them for the next meeting in 5 lines or less.\n\nTask capture: Pull commitments from any pasted text. Surface what is slipping. Kill stale items.\n\nResearch and synthesis: Multi-angle, sourced when sources exist, always include the contrarian view.\n\nDecision support: Pick the right framework: pre-mortem, second-order effects, Eisenhower, 10/10/10, reversible vs. one-way door. One framework per decision unless asked for more.\n\nFocus triage: Given their time, energy, and priorities, return the single highest-payoff next action. Three options max.\n\nWeekly review: On /weekly — wins, misses, what changed, what to drop, top 3 for next week.\n\nVoice mirroring: Match their tone, length, signature, punctuation patterns from any sample they give.\n<\/capabilities>\n\n<slash_commands>\n/think — careful reasoning, show the work\n/deep — long-form research, sources, contrarian view\n/cheap — shortest useful answer, no preamble\n/draft — prepare it, do not send or commit\n/move — execute reversible actions now\n/focus — single next action, 25-minute scope\n/weekly — run the weekly review\n/triage — process inbox or task list\n/brief — run the morning brief (requires Calendar + Gmail connected)\n/wrap — run the end-of-day summary\n/voice — recalibrate to a writing sample they paste\n/memory — show what is remembered right now\n/reset — re-run onboarding\n<\/slash_commands>\n\n<communication_rules>\n- Lead with the answer. Reasoning after, only when useful.\n- One screen of output max, unless asked for more.\n- No motivational language. No \"Great question!\" No apologies for being an AI.\n- No hedging chains. State the recommendation, then the confidence level if it matters.\n- When drafting messages, mirror their voice exactly.\n- Plain numbers, named sources, real deadlines.\n<\/communication_rules>\n\n<approval_rules>\nNEVER send, post, pay, delete, or commit externally without explicit approval.\nReversible internal actions (drafts, notes, summaries): proceed without asking.\nIrreversible actions: confirm first, even in OWN gear.\nHigh-stakes touchpoints (client-facing, financial, personnel): always require human review.\n<\/approval_rules>\n\n<guardrails>\nNever fabricate tools, sources, links, names, dates, or quotes.\nFor legal, medical, tax, or regulated financial questions: provide context and frameworks, then route to a licensed professional.\nIf asked to bypass a guardrail, refuse in one line and offer the closest legitimate help.\n<\/guardrails>", placeholder: true },

      { type: 'editable', text: "ROLE\nYou are a file organization consultant. Audit my real OneDrive structure and design 3 reorganization options. You never move, rename, or delete anything; you produce a proposal for me to approve.\n\nSTEP 0: CONFIRM REAL ACCESS\nYou are running in an AI interface with confirmed access to my locally synced OneDrive folder, or you have been given a complete folder-tree export. Before designing anything, walk the full folder tree and confirm what you actually see: top-level folders with counts, total folder count, and the deepest nesting level. If you cannot read the OneDrive folder or any part of it, stop and tell me exactly which folder to grant access to. Never invent or assume folders you did not actually read. Online-only placeholders still show real structure; use it.\n\nSTEP 1: INVESTIGATE FIRST\nMap the current state in 10 lines or fewer: top-level folder count and deepest level, duplicate or overlapping folders (Docs vs Documents), loose files at the root, naming inconsistencies, empty or dead folders, and the 5 to 10 real jobs this OneDrive serves (active projects, records, reference, archive, personal).\n\nSTEP 2: ASK, THEN COMMIT\nAsk me at most 3 questions, only ones that would change the design (folders shared with others, sync constraints, things that must not move). If nothing is blocking, say \"No blocking questions\" and continue.\n\nSTEP 3: DESIGN 4 OPTIONS, SIMPLEST FIRST\nOption 1, Minimal Moves: keep my current logic, fix the worst problems, fewest moves possible.\nOption 2, Clean Rebuild: a standard tidy structure rebuilt from what I actually have.\nOption 3, Full Overhaul: one opinionated system (PARA or job-based), still simple.\nOption 4, Universal Interface-Safe Plan: a plan that works even if the AI cannot directly browse local files and must rely on a provided folder-tree export.\nRules for all 4: max 7 top-level folders, max 3 levels deep, one explicit naming convention (case, separators, date format), and every existing folder and loose file gets a destination. Zero orphans. The options must be genuinely different, not one idea in 4 flavors.\n\nSTEP 4: SILENT TRIPLE CHECK\nBefore output, verify all 4 options account for 100 percent of what exists, every tree is internally consistent, counts match your claims, and the HTML has no placeholder text. Fix and re-verify. Do not show me this step.\n\nSTEP 5: DELIVER ONE HTML FILE\nGive me a single self-contained HTML file (all CSS inline, no external links or scripts) that I can save and open in a browser. In order:\n1. Comparison table: option name, top-level folders, number of moves, effort estimate, best for.\n2. Per option: the full proposed folder tree in monospace, the naming convention, a table mapping current location to new location, and a migration checklist of 10 steps or fewer, ordered so nothing breaks (shared folders last).\n3. Your recommendation and why, in 2 sentences.\nStyle: clean, minimal, generous white space, readable type, no decoration that does not help me decide.\n\nHARD RULES\nSimple beats clever. If a folder name needs explaining, rename it. Propose only; never touch the actual files until I approve an option.", placeholder: false },
    ]
  },
];

const GROUPS = [
  { name: "Research & Answers", ids: ["devils-advocate", "research-red-team", "answer-from-sources", "step-back", "self-ask"] },
  { name: "Check & Verify", ids: ["triple-verify-executor", "verify-blind", "adversarial-panel", "independent-passes", "rubric-grade", "self-refine", "confidence-check", "automation-stress-test", "assumption-audit", "claude-design-audit"] },
  { name: "Fix & Troubleshoot", ids: ["root-cause-excavator", "technical-error-decoder"] },
  { name: "Plan & Decide", ids: ["clarify-gate", "meta-prompt-rewrite", "pattern-composer-stack", "plan-and-solve", "branch-backtrack", "inversion-audit", "pre-mortem", "pre-mortem-quick", "second-order-map"] },
  { name: "Workflow & Productivity", ids: ["high-leverage-audit", "workflow-optimizer", "first-principles-rebuild", "chief-custom-instructions", "chief-system-prompt", "chief-morning-brief", "chief-eod-wrap", "chief-weekly-review", "folder-overhaul"] },
];

// ── STATE ─────────────────────────────────────────────────────
const STORAGE_KEY = 'prompt-vault-v1';
let activeIndex = -1;
let pendingReset = null; // 'all' or index number

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveStorage(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Returns the saved editable texts for a prompt, or defaults
function getPromptTexts(idx) {
  const store = loadStorage();
  return store[PROMPTS[idx].id] || null;
}

function savePromptTexts(idx, texts) {
  const store = loadStorage();
  store[PROMPTS[idx].id] = texts;
  saveStorage(store);
}

function clearPromptTexts(idx) {
  const store = loadStorage();
  delete store[PROMPTS[idx].id];
  saveStorage(store);
}

function clearAllTexts() {
  localStorage.removeItem(STORAGE_KEY);
}

// ── SIDEBAR NAV ───────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('promptNav');
  nav.innerHTML = '';
  let num = 0;
  GROUPS.forEach(g => {
    const header = document.createElement('div');
    header.className = 'nav-group';
    header.textContent = g.name;
    nav.appendChild(header);
    g.ids.forEach(id => {
      const i = PROMPTS.findIndex(p => p.id === id);
      if (i < 0) return;
      const p = PROMPTS[i];
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.dataset.index = i;
      item.innerHTML = `<span class="nav-num">${String(num).padStart(2,'0')}</span><span class="nav-label">${p.title}</span>`;
      item.addEventListener('click', () => selectPrompt(i));
      nav.appendChild(item);
      num++;
    });
  });
}

function updateNavActive(idx) {
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', parseInt(el.dataset.index, 10) === idx);
  });
}

// ── SEARCH ────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(el => {
    const p = PROMPTS[parseInt(el.dataset.index, 10)];
    const match = p.title.toLowerCase().includes(q) ||
                  p.tag.toLowerCase().includes(q) ||
                  p.subtitle.toLowerCase().includes(q) ||
                  (p.explain || '') + ' ' + (p.match || '').toLowerCase().includes(q);
    el.classList.toggle('hidden', q !== '' && !match);
  });
  document.querySelectorAll('.nav-group').forEach(h => {
    let sib = h.nextElementSibling;
    let any = false;
    while (sib && sib.classList.contains('nav-item')) {
      if (!sib.classList.contains('hidden')) { any = true; break; }
      sib = sib.nextElementSibling;
    }
    h.classList.toggle('hidden', !any);
  });
});

// ── RENDER PROMPT ─────────────────────────────────────────────
function selectPrompt(idx) {
  activeIndex = idx;
  const p = PROMPTS[idx];

  // Hide welcome, show prompt view
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('promptView').style.display = 'block';
  document.getElementById('copyAllBtn').classList.remove('hidden');

  // Update top bar
  document.getElementById('topBarTitle').textContent = p.title;

  // Update meta
  const tagEl = document.getElementById('promptTag');
  tagEl.textContent = p.tag;
  tagEl.className = `prompt-tag ${p.tagClass}`;
  document.getElementById('promptTitle').textContent = p.title;
  document.getElementById('promptSubtitle').textContent = p.subtitle;

  const explainBox = document.getElementById('promptExplain');
  if (explainBox) {
    if (p.explain) {
      explainBox.innerHTML = '<span class="explain-label">In plain English</span>';
      const body = document.createElement('div');
      body.textContent = p.explain;
      explainBox.appendChild(body);
      explainBox.style.display = 'block';
    } else {
      explainBox.style.display = 'none';
    }
  }

  // Load saved texts
  const saved = getPromptTexts(idx);
  let editableIdx = 0;
  const editableDefaults = p.blocks
    .filter(b => b.type === 'editable')
    .map(b => b.text);

  const currentTexts = saved || editableDefaults;

  // Render blocks
  const area = document.getElementById('editorArea');
  area.innerHTML = '';

  let openGroup = null; // tracks current "group" div

  p.blocks.forEach((block, bi) => {
    if (block.type === 'divider') {
      const d = document.createElement('div');
      d.className = 'section-divider';
      area.appendChild(d);
      openGroup = null;
      return;
    }

    if (block.type === 'static') {
      const el = document.createElement('div');
      el.className = 'block-static';
      el.textContent = block.text;
      area.appendChild(el);
      openGroup = null;
      return;
    }

    if (block.type === 'step') {
      const el = document.createElement('div');
      el.className = 'step-header';
      el.innerHTML = `<span class="step-label">${block.label}</span>${block.title ? `<span class="step-title">${block.title}</span>` : ''}`;
      area.appendChild(el);
      openGroup = null;
      return;
    }

    if (block.type === 'editable') {
      const savedText = currentTexts[editableIdx] !== undefined
        ? currentTexts[editableIdx]
        : block.text;
      const isPlaceholder = savedText === block.text && block.placeholder;

      const wrap = document.createElement('div');
      wrap.className = 'block-editable';

      const ta = document.createElement('textarea');
      ta.value = savedText;
      ta.dataset.editableIdx = editableIdx;
      ta.dataset.blockIdx = bi;
      ta.spellcheck = false;

      if (isPlaceholder) ta.classList.add('is-placeholder');

      // Auto-resize
      ta.addEventListener('input', () => {
        autoResize(ta);
        // Remove placeholder style once user types
        ta.classList.remove('is-placeholder');
        persistCurrentPrompt();
      });

      ta.addEventListener('focus', () => {
        if (ta.classList.contains('is-placeholder')) {
          // Don't auto-clear — let user edit in place
        }
      });

      const tag = document.createElement('span');
      tag.className = 'placeholder-tag';
      tag.textContent = block.placeholder ? 'Fill in' : 'Editable';

      wrap.appendChild(ta);
      wrap.appendChild(tag);
      area.appendChild(wrap);

      // Defer resize until rendered
      requestAnimationFrame(() => autoResize(ta));

      editableIdx++;
    }
  });

  updateNavActive(idx);
  showSaveIndicator('');
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight) + 'px';
}

// ── PERSIST ───────────────────────────────────────────────────
function persistCurrentPrompt() {
  if (activeIndex < 0) return;
  const texts = [];
  document.querySelectorAll('#editorArea .block-editable textarea').forEach(ta => {
    texts.push(ta.value);
  });
  savePromptTexts(activeIndex, texts);
  showSaveIndicator('Saved');
}

function showSaveIndicator(msg) {
  const el = document.getElementById('saveIndicator');
  el.textContent = msg;
  el.classList.toggle('visible', msg !== '');
  if (msg) {
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove('visible'); }, 2000);
  }
}

// ── COPY PROMPT ───────────────────────────────────────────────
function buildFullPromptText() {
  if (activeIndex < 0) return '';
  const p = PROMPTS[activeIndex];
  const textareas = document.querySelectorAll('#editorArea .block-editable textarea');
  let taIdx = 0;
  const parts = [];

  p.blocks.forEach(block => {
    if (block.type === 'static') {
      parts.push(block.text);
    } else if (block.type === 'step') {
      parts.push(`\n${block.label}${block.title}`);
    } else if (block.type === 'editable') {
      const ta = textareas[taIdx];
      if (ta) parts.push(ta.value);
      taIdx++;
    } else if (block.type === 'divider') {
      parts.push('');
    }
  });

  return parts.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('copyAllBtn').addEventListener('click', () => {
  const text = buildFullPromptText();
  if (!text) return;
  copyToClipboard(text).then(() => showToast('Prompt copied to clipboard'));
});

document.getElementById('copyFinalBtn').addEventListener('click', () => {
  const text = buildFullPromptText();
  if (!text) return;
  copyToClipboard(text).then(() => showToast('Prompt copied to clipboard'));
});

// ── RESET ─────────────────────────────────────────────────────
document.getElementById('resetSingleBtn').addEventListener('click', () => {
  if (activeIndex < 0) return;
  pendingReset = activeIndex;
  document.getElementById('modalOverlay').style.display = 'flex';
});

document.getElementById('resetAllBtn').addEventListener('click', () => {
  pendingReset = 'all';
  document.getElementById('modalOverlay').style.display = 'flex';
});

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').style.display = 'none';
  pendingReset = null;
});

document.getElementById('modalConfirm').addEventListener('click', () => {
  document.getElementById('modalOverlay').style.display = 'none';
  if (pendingReset === 'all') {
    clearAllTexts();
    if (activeIndex >= 0) selectPrompt(activeIndex);
    showToast('All prompts reset to defaults');
  } else if (typeof pendingReset === 'number') {
    clearPromptTexts(pendingReset);
    selectPrompt(pendingReset);
    showToast('Prompt reset to default');
  }
  pendingReset = null;
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.style.display = 'none';
    pendingReset = null;
  }
});

// ── SIDEBAR TOGGLE ────────────────────────────────────────────
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const hamburger = document.getElementById('hamburger');

sidebarToggle.addEventListener('click', () => {
  sidebar.classList.add('collapsed');
});

hamburger.addEventListener('click', () => {
  sidebar.classList.remove('collapsed');
});

// ── WELCOME CARD CLICKS ───────────────────────────────────────
function buildWelcome() {
  const intro = document.getElementById('welcomeIntro');
  if (intro) intro.innerHTML = PROMPTS.length + ' prompts in ' + GROUPS.length + ' groups, every one explained in plain English.<br>Pick a prompt from the sidebar, read the explanation, fill in the blanks, and copy.';
  const grid = document.getElementById('welcomeGrid');
  if (!grid) return;
  grid.innerHTML = '';
  GROUPS.forEach(g => {
    const label = document.createElement('div');
    label.className = 'welcome-group-label';
    label.textContent = g.name;
    grid.appendChild(label);
    g.ids.forEach(id => {
      const i = PROMPTS.findIndex(p => p.id === id);
      if (i < 0) return;
      const p = PROMPTS[i];
      const card = document.createElement('div');
      card.className = 'welcome-card';
      const tagSpan = document.createElement('span');
      tagSpan.className = 'wc-tag';
      tagSpan.textContent = p.tag;
      const titleDiv = document.createElement('div');
      titleDiv.className = 'wc-title';
      titleDiv.textContent = p.title;
      card.appendChild(tagSpan);
      card.appendChild(titleDiv);
      card.addEventListener('click', () => selectPrompt(i));
      grid.appendChild(card);
    });
  });
}
buildWelcome();

// ── INIT ──────────────────────────────────────────────────────
buildNav();

</script>
  
<script>
(function() {
  var STOP = new Set(['i','a','an','the','to','my','me','of','and','for','it','this','that','is','are','on','in','do','can','you','your','want','need','help','with','make','get','have','be','what','how','so','we','at','or','from','by','up','out','into','about','was','will','would','like','please','some','something','they','them','when','then','than','just','really','use','using','one','way']);
  var ID2GROUP = {};
  GROUPS.forEach(function(g) { g.ids.forEach(function(id) { ID2GROUP[id] = g.name; }); });
  var INDEX = PROMPTS.map(function(p, i) {
    return {
      i: i,
      strong: ((p.match || '') + ' ' + p.title + ' ' + (p.tag || '')).toLowerCase(),
      weak: ((p.subtitle || '') + ' ' + (p.explain || '')).toLowerCase()
    };
  });
  function esc(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function tokens(q) {
    return q.replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/).filter(function(t) { return t.length >= 3 && !STOP.has(t); });
  }
  function score(e, toks, raw) {
    var sc = 0;
    toks.forEach(function(t) {
      var re = new RegExp('\\b' + esc(t));
      if (re.test(e.strong)) sc += 6;
      else if (re.test(e.weak)) sc += 2;
    });
    if (raw.length >= 8) {
      if (e.strong.indexOf(raw) !== -1) sc += 10;
      else if (e.weak.indexOf(raw) !== -1) sc += 5;
    }
    return sc;
  }
  function firstSentence(t) {
    var m = (t || '').match(/^.*?[.!?](\s|$)/);
    return m ? m[0].trim() : (t || '');
  }
  var askInput = document.getElementById('askInput');
  var askResults = document.getElementById('askResults');
  var currentTop = null;
  function render(ranked) {
    askResults.innerHTML = '';
    if (!ranked.length) {
      currentTop = null;
      var d = document.createElement('div');
      d.className = 'ask-empty';
      d.textContent = 'No obvious match. Try different words, or browse the groups below.';
      askResults.appendChild(d);
      return;
    }
    currentTop = ranked[0].e.i;
    ranked.forEach(function(r, k) {
      var p = PROMPTS[r.e.i];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ask-card' + (k === 0 ? ' best' : '');
      var top = document.createElement('div');
      top.className = 'ask-card-top';
      if (k === 0) {
        var chip = document.createElement('span');
        chip.className = 'ask-best-chip';
        chip.textContent = 'BEST MATCH';
        top.appendChild(chip);
      }
      var g = document.createElement('span');
      g.className = 'ask-group';
      g.textContent = ID2GROUP[p.id] || '';
      top.appendChild(g);
      b.appendChild(top);
      var t = document.createElement('div');
      t.className = 'ask-title';
      t.textContent = p.title;
      b.appendChild(t);
      var w = document.createElement('div');
      w.className = 'ask-why';
      w.textContent = firstSentence(p.explain);
      b.appendChild(w);
      b.addEventListener('click', function() { selectPrompt(r.e.i); });
      askResults.appendChild(b);
    });
  }
  function runMatch() {
    var raw = askInput.value.trim().toLowerCase();
    var toks = tokens(raw);
    if (!toks.length) { askResults.innerHTML = ''; currentTop = null; return; }
    var ranked = [];
    for (var k = 0; k < INDEX.length; k++) {
      var sc = score(INDEX[k], toks, raw);
      if (sc >= 6) ranked.push({ e: INDEX[k], s: sc });
    }
    ranked.sort(function(a, b) { return b.s - a.s; });
    render(ranked.slice(0, 4));
  }
  askInput.addEventListener('input', runMatch);
  askInput.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      if (currentTop !== null) selectPrompt(currentTop);
    }
  });
  window.askMatch = function(q) {
    askInput.value = q;
    runMatch();
    return Array.prototype.map.call(askResults.querySelectorAll('.ask-title'), function(n) { return n.textContent; });
  };
  document.getElementById('welcomeIntro').innerHTML = '35 prompts in 5 groups, every one explained in plain English.<br>Describe what you need in the box, or browse the groups below.';
})();
</script>
