function renderHotkeys(){let q=document.getElementById('search').value.toLowerCase().trim(),app=document.getElementById('filter').value,groups=new Map(),shown=0,total=0;hotkeys.forEach(x=>{total+=x.rows.length;if(app&& !x.app.startsWith(app))return;let rows=x.rows.filter(r=>matches(`${x.app} ${x.cat} ${r[0]} ${r[1]}`,q));if(rows.length){shown+=rows.length;if(!groups.has(x.app))groups.set(x.app,[]);groups.get(x.app).push({...x,rows})}});let out='',i=0;groups.forEach((items,name)=>{let inside=items.map(x=>`<details class="subgroup" ${q?'open':''}><summary>${esc(x.cat)}</summary><div class="rows">${x.rows.map(r=>`<div class="row"><div class="keys"><span class="key">${esc(r[0])}</span></div><div class="action">${esc(r[1])}</div><div class="status">Current</div><button class="copy" data-copy="${esc(r[0])}" title="Copy shortcut">⧉</button></div>`).join('')}</div></details>`).join('');out+=`<details class="group" ${q||i===0?'open':''}><summary>${esc(name)}</summary>${inside}</details>`;i++});document.getElementById('hotkeyContent').innerHTML=out||'<div class="empty">No hotkeys match that search.</div>';document.getElementById('count').textContent=q?`${shown} matching hotkeys`:`${total} hotkeys`;bindCopy();renderSources()}

/section><section class=\"hero\"><div class=\"start\"><div class=\"label\">What are you trying to accomplish?</div><div class=\"searchwrap\"><input id=\"q\" class=\"search\" type=\"search\" autocomplete=\"off\" placeholder=\"Describe the outcome you want\" aria-label=\"What are you trying to accomplish?\"><button id=\"clear\" class=\"clear\" aria-label=\"Clear search\" hidden>×</button></div><p class=\"startnote\">Search 60 prompts or let Mission Control build a safe fallback.</p></div><div class=\"stat\"><div class=\"label\">Library</div><b id=\"libraryCount\">60</b><span>approved prompts</span></div><div class=\"stat\"><div class=\"label\">Favorites</div><b id=\"favCount\">0</b><span>saved on this device</span></div></section>\n<div class=\"meta\"><span id=\"note\" aria-live=\"polite\"></span><span id=\"matchCount\"></span></div>\n<section id=\"home\" class=\"homegrid\"><div class=\"panel\"><h2>Choose by outcome</h2><p class=\"panelintro\">Start with the job, not the name of a prompt.</p><div class=\"outcomes\" id=\"outcomes\"></div></div><div class=\"sideStack\"><div class=\"panel\"><h2>Pinned prompts</h2><p class=\"panelintro\">Favorites appear here. Suggested starters show until you save your own.</p><div id=\"pinned\" class=\"list\"></div></div><div class=\"panel\"><h2>Recent activity</h2><p class=\"panelintro\">Searches and prompts used on this device.</p><div id=\"recent\" class=\"list\"></div><div class=\"recentAdded\"><div class=\"label\">Recently added</div><div id=\"added\"></div></div></div></div></section>\n<section id=\"workspace\" class=\"workspace\"><div class=\"resultsPane\"><div class=\"paneHead\"><b>Results</b><span id=\"resultSummary\"></span></div><div class=\"filters\" id=\"filters\"></div><div class=\"results\" id=\"results\"></div></div><div class=\"detailPane\"><div class=\"paneHead\"><b>Prompt workspace</b><span>Editable before copying</span></div><div id=\"detail\" class=\"detail\"></div></div></section>\n<p class=\"footer\">Keyboard: <b>/</b> search · <b>↑ ↓</b> move · <b>Enter</b> open · <b>Ctrl + Enter</b> copy · <b>Esc</b> clear</p></main><div class=\"toast\" id=\"toast\" role=\"status\"></div><script>\nvar DATA={\"G\": [{\"id\": \"basics\", \"title\": \"Everyday basics\", \"tag\": \"BASICS\", \"blurb\": \"The four you will use most, including a quick research check. Start here if you are not sure.\"}, {\"id\": \"quick\", \"title\": \"Quick everyday tools\", \"tag\": \"QUICK\", \"blurb\": \"Twenty one line jobs for text you already have. Shorten it, fix the tone, pull the action items, name it. All twenty are in your favorites.\"}, {\"id\": \"research\", \"title\": \"Research and answers\", \"tag\": \"RESEARCH\", \"blurb\": \"Get a real answer instead of a confident guess.\"}, {\"id\": \"check\", \"title\": \"Check and verify\", \"tag\": \"CHECK\", \"blurb\": \"Catch mistakes before they cost you something.\"}, {\"id\": \"fix\", \"title\": \"Fix and troubleshoot\", \"tag\": \"FIX\", \"blurb\": \"Something is broken and you need the real cause.\"}, {\"id\": \"plan\", \"title\": \"Plan and decide\", \"tag\": \"PLAN\", \"blurb\": \"Think it through before you commit time or money.\"}, {\"id\": \"workflow\", \"title\": \"Workflow and productivity\", \"tag\": \"WORKFLOW\", \"blurb\": \"Run your week, your systems, and your files better.\"}], \"P\": [{\"id\": \"summarize\", \"group\": \"basics\", \"favorite\": true, \"title\": \"Summarize this in plain English\", \"original\": \"Summarize Text Prompt\", \"summary\": \"Turns long text into short bullets anyone can follow.\", \"when\": \"You got a long email, contract, article, or report and you do not want to read all of it.\", \"output\": \"Short bullets, plain wording, a one line takeaway, and a real world example.\", \"body\": \"Summarize the text below so it is very easy to understand.\\n\\nRules:\\n1. Use short bullet points.\\n2. Use simple everyday language.\\n3. Keep only the most important information.\\n4. Explain any technical or confusing term in plain English.\\n5. Do not add detail that is not in the text.\\n\\nThen add a line starting with \\\"In simple terms:\\\" and explain the overall meaning in one or two sentences.\\n\\nThen add a line starting with \\\"Example:\\\" and give a short real world situation that shows how this applies or why it matters.\\n\\nText:\\n[paste here]\"}, {\"id\": \"explain-simply\", \"group\": \"basics\", \"favorite\": true, \"title\": \"Explain this like I am new to it\", \"original\": \"Explain Simply Prompt\", \"summary\": \"Beginner level explanation with no jargon.\", \"when\": \"You hit a term, a system, or a concept you have never dealt with before.\", \"output\": \"Short paragraphs or bullets, every technical term defined, one sentence takeaway at the end.\", \"body\": \"Explain the following in plain English for someone brand new to the topic.\\n\\nRules:\\n1. No jargon. If you must use a technical term, define it right there in simple words.\\n2. Use short paragraphs or bullets.\\n3. Use a familiar comparison if it makes the idea click.\\n4. Do not assume any background knowledge.\\n\\nEnd with a single sentence takeaway that starts with \\\"Bottom line:\\\".\\n\\nTopic:\\n[paste here]\"}, {\"id\": \"rewrite-clarity\", \"group\": \"basics\", \"favorite\": true, \"title\": \"Rewrite this so it is clearer\", \"original\": \"Rewrite for Clarity Prompt\", \"summary\": \"Same meaning, tighter and easier to read.\", \"when\": \"Before you send an important email, proposal, or message you want taken seriously.\", \"output\": \"A cleaner version of your text, plus a note on what was changed.\", \"body\": \"Rewrite the text below so it is clearer, tighter, and easier to read.\\n\\nRules:\\n1. Keep the original meaning and any specific numbers, names, or dates.\\n2. Remove fluff, filler, and repetition.\\n3. Use direct simple language and active voice.\\n4. Keep the same tone unless I tell you otherwise.\\n\\nAfter the rewrite, add a short list titled \\\"What I changed\\\" with three bullets or fewer.\\n\\nText:\\n[paste here]\"}, {\"id\": \"research-challenge\", \"group\": \"basics\", \"favorite\": true, \"title\": \"Look it up, then argue against it\", \"original\": \"Research and Devil's Advocate\", \"summary\": \"Researches the answer with real sources, then argues against its own answer before you act on it.\", \"when\": \"You are about to rely on something you are not sure about, or you want the other side of the argument before you commit time or money.\", \"output\": \"A sourced answer, the strongest case against it, then a verdict with a confidence level.\", \"body\": \"Research the question below, then argue against your own answer. Do all three passes and label them.\\n\\nPass 1, research:\\n1. Answer using current reliable sources. Name each source and its date.\\n2. Separate what is confirmed fact, what is your own inference, and what is unknown.\\n3. If the sources disagree, say so instead of quietly picking a side.\\n\\nPass 2, devil's advocate:\\n4. Now argue against your own answer as hard as you can. Hit the weakest evidence first.\\n5. List every assumption the answer depends on, and what would have to be true for it to be wrong.\\n6. Give the strongest real counter example or opposing view you can find.\\n\\nPass 3, verdict:\\n7. Say which side actually holds up and why, in two sentences or less.\\n8. Give a confidence level of high, medium, or low.\\n9. Name the one piece of information that would change your answer.\\n\\nQuestion or claim:\\n[paste here]\"}, {\"id\": \"devils-advocate\", \"group\": \"research\", \"favorite\": false, \"title\": \"Argue against my idea\", \"original\": \"Devil's Advocate\", \"summary\": \"Attacks your idea on purpose so you find the hole before someone else does.\", \"when\": \"You are excited about a plan and nobody around you is pushing back on it.\", \"output\": \"The weakest assumption, the strongest counter argument, and what would have to be true for your idea to work.\", \"body\": \"Act as a devil's advocate on the idea below. Do not validate it.\\n\\n1. Name the single weakest assumption the idea depends on.\\n2. Give the strongest argument against it, written the way a smart critic would say it.\\n3. List three ways this fails in practice even if the logic is sound.\\n4. State what would have to be true for the idea to actually work.\\n5. Finish with a verdict: proceed, change something specific, or drop it.\\n\\nBe blunt. Do not soften it. Do not compliment the idea.\\n\\nIdea:\\n[paste here]\"}, {\"id\": \"red-team-research\", \"group\": \"research\", \"favorite\": false, \"title\": \"Research it, then try to disprove it\", \"original\": \"Research, Red Team, Re-Research\", \"summary\": \"Builds the case, then attacks its own case, then checks again.\", \"when\": \"The answer matters and a first pass search is not good enough.\", \"output\": \"Three passes: the findings, the holes in those findings, then a corrected final answer.\", \"body\": \"Answer the question below in three labeled passes.\\n\\nPass 1 Research: give the best supported answer you can, with the reasoning and the strongest evidence.\\n\\nPass 2 Red team: attack your own Pass 1. Where is the evidence thin, outdated, cherry picked, or contradicted? What would an informed skeptic say?\\n\\nPass 3 Re-research: rewrite the answer with the Pass 2 problems fixed. Flag anything you still cannot confirm and say exactly what would settle it.\\n\\nQuestion:\\n[paste here]\"}, {\"id\": \"sources-only\", \"group\": \"research\", \"favorite\": false, \"title\": \"Answer using only the sources I gave you\", \"original\": \"Answer From Sources Only\", \"summary\": \"Stops the AI from filling gaps with things it made up.\", \"when\": \"You pasted a document, contract, or policy and you need answers grounded in that text only.\", \"output\": \"Answers with quotes or line references, and an honest list of what the source does not cover.\", \"body\": \"Use only the source material I provide below. Do not use outside knowledge.\\n\\nRules:\\n1. Every claim must be traceable to the source. Quote the exact line or short passage that supports it.\\n2. If the source does not answer part of my question, say \\\"Not covered in the source\\\" instead of guessing.\\n3. Do not infer intent that is not written down. If something is ambiguous, say so and give both readings.\\n4. End with a short list titled \\\"Gaps in the source\\\".\\n\\nQuestion:\\n[paste question here]\\n\\nSource:\\n[paste source here]\"}, {\"id\": \"step-back\", \"group\": \"research\", \"favorite\": false, \"title\": \"Zoom out to the bigger picture\", \"original\": \"Step-Back Prompt\", \"summary\": \"Finds the general rule behind your specific question, then answers it.\", \"when\": \"You are stuck in the weeds and keep getting narrow or useless answers.\", \"output\": \"The underlying principle first, then the specific answer built on it.\", \"body\": \"Before answering my specific question, step back.\\n\\n1. State the broader question or principle my question is really an instance of.\\n2. Answer that broader question first in a few sentences.\\n3. Now answer my specific question using that principle.\\n4. Point out anything in my framing that was too narrow or aimed at the wrong problem.\\n\\nMy question:\\n[paste here]\"}, {\"id\": \"self-ask\", \"group\": \"research\", \"favorite\": false, \"title\": \"Break the question into smaller questions\", \"original\": \"Self-Ask Decomposition\", \"summary\": \"Splits a messy question into parts and answers them one at a time.\", \"when\": \"Your question has several moving pieces and single answers keep missing something.\", \"output\": \"A list of sub questions, an answer to each, then one combined conclusion.\", \"body\": \"Break my question into the smaller questions that must be answered first.\\n\\n1. List the sub questions in the order they need to be answered.\\n2. Answer each one separately and briefly.\\n3. Note where an answer depends on an assumption rather than a fact.\\n4. Combine them into one final answer.\\n5. State which sub question, if answered wrong, would change the final answer the most.\\n\\nMy question:\\n[paste here]\"}, {\"id\": \"triple-verify\", \"group\": \"check\", \"favorite\": false, \"title\": \"Check the work three times before answering\", \"original\": \"Deep Prep & Triple Verify Executor\", \"summary\": \"Plans, does the work, then verifies it in three separate passes.\", \"when\": \"The output is going to a client, a lawyer, an inspector, or anyone who will catch errors.\", \"output\": \"The finished work plus a verification log showing what was checked and what got corrected.\", \"body\": \"Do the task below with a prep and verify process.\\n\\nStep 1 Prep: restate the task, list what a correct result must include, and list the ways this usually goes wrong.\\n\\nStep 2 Execute: do the work.\\n\\nStep 3 Verify in three passes.\\nPass A accuracy: check every fact, number, name, and calculation.\\nPass B completeness: check the result against the requirements from Step 1.\\nPass C usability: read it as the person receiving it. Is anything unclear or missing?\\n\\nStep 4: list every correction you made, then give the final version.\\n\\nTask:\\n[paste here]\"}, {\"id\": \"blind-fact-check\", \"group\": \"check\", \"favorite\": false, \"title\": \"Fact-check every claim from scratch\", \"original\": \"Blind Fact-Check\", \"summary\": \"Checks each claim on its own without trusting how it was written or who wrote it.\", \"when\": \"Someone sent you a confident document and you need to know what is actually true.\", \"output\": \"A claim by claim verdict: supported, unsupported, wrong, or unverifiable, with the reason.\", \"body\": \"Fact-check the text below. Treat it as unverified.\\n\\nRules:\\n1. Pull out every factual claim as its own line. Ignore opinion and tone.\\n2. Judge each claim on its own. Do not assume a claim is true because the rest of the document is confident or well written.\\n3. Label each claim: Supported, Unsupported, Incorrect, or Cannot verify. Give a one line reason.\\n4. Flag numbers, dates, quotes, and statistics specifically. Those break most often.\\n5. End with the three claims that would do the most damage if they are wrong.\\n\\nText:\\n[paste here]\"}, {\"id\": \"expert-panel\", \"group\": \"check\", \"favorite\": false, \"title\": \"Have skeptical experts tear it apart\", \"original\": \"Adversarial Expert Panel\", \"summary\": \"Reviews your work from several expert angles that disagree with each other.\", \"when\": \"A decision touches money, legal exposure, safety, or reputation.\", \"output\": \"Separate critiques from each expert role, the disagreements between them, then a combined fix list.\", \"body\": \"Review the material below as a panel of four skeptical experts. Pick the four roles that fit the subject, for example a domain specialist, a risk or compliance reviewer, a cost or operations reviewer, and the end user.\\n\\nFor each expert:\\n1. State the role and what they care about.\\n2. Give their three strongest objections.\\n3. Give the one thing they would refuse to sign off on.\\n\\nThen:\\n4. Show where the experts disagree with each other and who has the better argument.\\n5. Give a single prioritized fix list.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"independent-passes\", \"group\": \"check\", \"favorite\": false, \"title\": \"Answer twice separately, then compare\", \"original\": \"Independent Passes Check\", \"summary\": \"Solves it two independent ways and shows where the two answers disagree.\", \"when\": \"You want a reliability check on a number, a calculation, or a judgment call.\", \"output\": \"Two independent answers, the differences between them, and which one holds up.\", \"body\": \"Answer the question below twice, independently.\\n\\nPass 1: answer it using your first approach. Show the reasoning.\\n\\nPass 2: start over and use a different method, source, or angle. Do not lean on Pass 1 while you build it.\\n\\nCompare: list every point where the two passes disagree, explain why, and state which one is more reliable and how confident you are.\\n\\nIf both passes agree, say what they might both be getting wrong for the same reason.\\n\\nQuestion:\\n[paste here]\"}, {\"id\": \"rubric-grade\", \"group\": \"check\", \"favorite\": false, \"title\": \"Grade the work against a scorecard\", \"original\": \"Rubric Self-Grade\", \"summary\": \"Builds a scoring sheet, then scores the work honestly against it.\", \"when\": \"You need an objective read on quality instead of a vague opinion.\", \"output\": \"A rubric with scores out of ten, evidence for each score, and what would raise the lowest score.\", \"body\": \"Grade the work below.\\n\\n1. First build a rubric of five to seven criteria that actually matter for this kind of work. Define what a 10 looks like and what a 4 looks like for each.\\n2. Score the work on each criterion out of 10 and quote the specific evidence for the score.\\n3. Be strict. Do not give a score above 8 without naming the concrete reason it earned it.\\n4. Give the total and the single lowest score.\\n5. List the exact changes that would raise the lowest two scores by three points.\\n\\nWork:\\n[paste here]\"}, {\"id\": \"self-refine\", \"group\": \"check\", \"favorite\": false, \"title\": \"Find the weak spots and fix them\", \"original\": \"Self-Refine Loop\", \"summary\": \"Critiques its own draft, rewrites it, then checks the rewrite.\", \"when\": \"A first draft is close but not good enough to send.\", \"output\": \"The critique, the improved version, and a check confirming the problems are gone.\", \"body\": \"Improve the draft below using a critique and revise loop.\\n\\nRound 1: list the five biggest weaknesses in the draft. Be specific and quote the problem lines.\\nRound 2: rewrite the draft fixing all five.\\nRound 3: review your rewrite against the same five points and confirm each is fixed or explain why it could not be.\\nRound 4: give the final version only, clean and ready to use.\\n\\nDo not tell me the draft is already good. Find the weaknesses.\\n\\nDraft:\\n[paste here]\"}, {\"id\": \"confidence-check\", \"group\": \"check\", \"favorite\": false, \"title\": \"Say what is certain and what is not\", \"original\": \"Confidence Check\", \"summary\": \"Separates solid facts from guesses so you know what to double check.\", \"when\": \"You are about to act on an answer and you need to know which parts to trust.\", \"output\": \"Three buckets: confident, uncertain, and needs verification, plus how to verify each.\", \"body\": \"Take your answer below and sort every part of it into three buckets.\\n\\n1. Confident: things you are sure about and why.\\n2. Uncertain: things that are probably right but could be wrong, with the reason for the doubt.\\n3. Needs verification: things you cannot confirm, with the exact source or test that would confirm them.\\n\\nRules: do not present a guess as a fact. If the whole answer rests on one uncertain item, say that first.\\n\\nAnswer or topic:\\n[paste here]\"}, {\"id\": \"automation-stress\", \"group\": \"check\", \"favorite\": false, \"title\": \"Break my automation on purpose\", \"original\": \"Automation Stress Test\", \"summary\": \"Hunts for the weird inputs and edge cases that will make your workflow fail.\", \"when\": \"Before you turn on an automation, a rule, or a scheduled job that runs without you watching.\", \"output\": \"A list of failure scenarios, how each one shows up, and the guard rail that prevents it.\", \"body\": \"Stress test the automation or workflow below.\\n\\n1. List every input it assumes will be present, correctly formatted, and on time.\\n2. Break each assumption: empty value, wrong format, duplicate, out of order, very large, very old, permission denied, service offline.\\n3. For each break, say what the automation actually does and whether the failure is silent.\\n4. Rank the failures by damage, worst first. Silent failures rank higher.\\n5. Give the specific guard rail, check, or alert that prevents each of the top five.\\n\\nAutomation:\\n[paste here]\"}, {\"id\": \"assumption-audit\", \"group\": \"check\", \"favorite\": false, \"title\": \"List what this assumes and what is risky\", \"original\": \"Assumption Audit\", \"summary\": \"Surfaces the unspoken assumptions and rates how dangerous each one is.\", \"when\": \"A plan feels fine but you cannot say exactly why it would work.\", \"output\": \"Every assumption listed, rated by risk, with the cheapest way to test the risky ones.\", \"body\": \"Audit the assumptions in the material below.\\n\\n1. List every assumption, including the unstated ones about people, timing, money, tools, and behavior.\\n2. Rate each: Safe, Probably fine, or Risky. Say why.\\n3. For each Risky assumption, describe what happens if it turns out false.\\n4. Give the cheapest fastest way to test each Risky assumption before committing.\\n5. Name the one assumption that carries the most weight.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"doc-audit\", \"group\": \"check\", \"favorite\": false, \"title\": \"Review my whole document for structure and clarity\", \"original\": \"Full-Document Design Audit\", \"summary\": \"Full read of a document for flow, gaps, repetition, and formatting.\", \"when\": \"You built a long document and it feels messy but you cannot pinpoint where.\", \"output\": \"Section by section notes, a structure problem list, and a recommended reorder.\", \"body\": \"Audit the full document below.\\n\\n1. Map the current structure as an outline so I can see the real flow.\\n2. Section by section, note what works, what is unclear, what repeats elsewhere, and what is missing.\\n3. Flag inconsistent terms, formatting, headings, and tone.\\n4. Identify anything a reader would need that is not in here.\\n5. Recommend a reordered outline and explain each move in one line.\\n6. End with the three fixes that improve it the most.\\n\\nDocument:\\n[paste here]\"}, {\"id\": \"root-cause\", \"group\": \"fix\", \"favorite\": false, \"title\": \"Dig until you find the real cause\", \"original\": \"Root Cause Excavator\", \"summary\": \"Keeps asking why until it hits the actual source instead of the symptom.\", \"when\": \"The same problem keeps coming back after you fix it.\", \"output\": \"A chain from symptom to root cause, the evidence for each link, and the fix that stops the repeat.\", \"body\": \"Find the root cause of the problem below. Do not stop at the first plausible explanation.\\n\\n1. State the symptom exactly as I described it.\\n2. List every possible cause, including the boring ones.\\n3. For the top candidates, ask why five times in a row and show the chain.\\n4. Say what evidence would confirm or rule out each candidate, and what I should check first.\\n5. Separate the fix that stops the symptom now from the fix that stops it coming back.\\n\\nProblem:\\n[paste here]\"}, {\"id\": \"error-decoder\", \"group\": \"fix\", \"favorite\": false, \"title\": \"Explain this error and how to fix it\", \"original\": \"Technical Error Decoder\", \"summary\": \"Translates a technical error message into plain English with fixes to try in order.\", \"when\": \"An app, script, or device throws an error you do not understand.\", \"output\": \"What the error means, the likely causes ranked, and step by step fixes from safest to most drastic.\", \"body\": \"Decode the error below.\\n\\n1. Explain in plain English what the error actually means. No jargon.\\n2. List the likely causes ranked by how common they are.\\n3. Give fixes in order from safest and fastest to most drastic. Number them so I can work down the list.\\n4. Tell me exactly what to look at to confirm the fix worked.\\n5. Tell me what information to grab if none of the fixes work, so the next person does not start over.\\n\\nError message and context:\\n[paste here]\"}, {\"id\": \"clarify-gate\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Ask me questions before you start\", \"original\": \"Clarify Before You Start Gate\", \"summary\": \"Forces the AI to ask what it needs instead of guessing and wasting your time.\", \"when\": \"The task is big or expensive to redo, and a wrong assumption early ruins the whole thing.\", \"output\": \"A short list of must answer questions, then the work once you have answered.\", \"body\": \"Do not start the task yet.\\n\\n1. Ask me the questions you genuinely need answered to do this correctly. Maximum five, ranked by how much the answer changes the output.\\n2. For each question, say what you would assume if I do not answer, so I can catch a bad assumption.\\n3. Wait for my answers.\\n4. Once I answer, restate the task in one paragraph and confirm before doing the work.\\n\\nTask:\\n[paste here]\"}, {\"id\": \"meta-prompt\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Rewrite my prompt so it works better\", \"original\": \"Meta-Prompt Rewrite\", \"summary\": \"Fixes your prompt before running it so you get a better answer.\", \"when\": \"You keep getting mediocre results and you suspect the ask is the problem.\", \"output\": \"Your prompt rewritten, an explanation of the changes, and the answer to the improved version.\", \"body\": \"Improve my prompt before you answer it.\\n\\n1. Tell me what is vague, missing, or contradictory in my prompt.\\n2. Rewrite it as a stronger prompt with clear role, context, constraints, and output format.\\n3. Explain each change in one line so I learn the pattern.\\n4. Then run your improved version and give me the answer.\\n\\nMy prompt:\\n[paste here]\"}, {\"id\": \"pattern-stack\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Pick and combine the right approaches\", \"original\": \"The Pattern Stack (Composer Default)\", \"summary\": \"Chooses which thinking methods fit your task and runs them in the right order.\", \"when\": \"The task is complex and you do not know which approach to use.\", \"output\": \"The chosen methods, why each was chosen, and the work done in that order.\", \"body\": \"Choose the right approach for the task below before doing it.\\n\\n1. Name the three to five methods that fit this task, for example clarify first, break into sub questions, plan then solve, red team, verify in passes, pre-mortem.\\n2. Say why each one fits and what it adds.\\n3. Put them in the order they should run and explain the order.\\n4. Run the stack and label each stage as you go.\\n5. End with the final result on its own, clean, with the working shown above it.\\n\\nTask:\\n[paste here]\"}, {\"id\": \"plan-and-solve\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Make a plan first, then solve it\", \"original\": \"Plan and Solve\", \"summary\": \"Writes the plan, gets it visible, then executes it step by step.\", \"when\": \"A multi step job where skipping straight to the answer usually goes sideways.\", \"output\": \"A numbered plan, the execution of each step, and a check that the plan was followed.\", \"body\": \"Solve the task below in two phases.\\n\\nPhase 1 Plan: break the task into numbered steps, note what each step needs as input, and flag the step most likely to go wrong. Do not solve anything yet.\\n\\nPhase 2 Solve: work through the steps in order, showing the result of each one.\\n\\nThen confirm every step in the plan was actually completed, and list anything the plan missed once you got into it.\\n\\nTask:\\n[paste here]\"}, {\"id\": \"branch-backtrack\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Try several paths and keep the best one\", \"original\": \"Branch and Backtrack\", \"summary\": \"Explores multiple options in parallel, drops the dead ends, and defends the winner.\", \"when\": \"There are several ways to do it and you want them compared honestly.\", \"output\": \"Three or four options with trade offs, the ones that were dropped and why, and a recommendation.\", \"body\": \"Explore several approaches to the task below instead of committing to the first one.\\n\\n1. Generate three or four genuinely different approaches. No near duplicates.\\n2. Develop each one far enough to see the real trade offs, cost, effort, and risk.\\n3. Abandon the ones that fail and say exactly where they broke down.\\n4. Recommend the best one and explain what would make you switch to the runner up.\\n5. Note the conditions where your recommendation would be the wrong call.\\n\\nTask:\\n[paste here]\"}, {\"id\": \"inversion\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Work backwards from what would ruin this\", \"original\": \"Inversion Audit\", \"summary\": \"Asks how to guarantee failure, then removes those things from your plan.\", \"when\": \"You want a fast sanity check on a plan without a full review.\", \"output\": \"A list of guaranteed ways to fail, which ones your plan already does, and the fixes.\", \"body\": \"Run an inversion check on the plan below.\\n\\n1. Answer this first: if the goal were to make this fail completely, what would you do?\\n2. List those failure moves in order of effectiveness.\\n3. Go through my plan and mark every place it already does one of those things, even partly.\\n4. Give the specific change that removes each one.\\n5. End with the single most dangerous item still in the plan.\\n\\nPlan:\\n[paste here]\"}, {\"id\": \"premortem\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Pretend it already failed and explain why\", \"original\": \"Pre-Mortem Failure Autopsy\", \"summary\": \"Writes the story of the failure before it happens so you can prevent it.\", \"when\": \"Before you commit real money, real time, or your reputation.\", \"output\": \"A failure story, the causes in order, the early warning signs, and the preventions.\", \"body\": \"It is six months from now and the plan below failed badly.\\n\\n1. Write the short story of how it failed, in past tense, as if reporting facts.\\n2. List the causes in the order they happened, from the first bad decision to the final result.\\n3. Identify the earliest warning sign for each cause, the thing I could have noticed but would probably ignore.\\n4. Give the specific prevention for each cause and say who or what has to own it.\\n5. Rank the causes by likelihood, not drama.\\n\\nPlan:\\n[paste here]\"}, {\"id\": \"premortem-2s\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Two sentence failure check\", \"original\": \"Pre-Mortem in Two Sentences\", \"summary\": \"The fastest possible version of the failure check.\", \"when\": \"Small decisions where a full review is overkill but zero review is careless.\", \"output\": \"One sentence on how it fails, one sentence on the fix.\", \"body\": \"In exactly two sentences: sentence one, the most likely way this fails. Sentence two, the single change that prevents it.\\n\\nNo preamble, no caveats, no list.\\n\\nPlan or decision:\\n[paste here]\"}, {\"id\": \"second-order\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Map what happens after what happens\", \"original\": \"Second-Order Consequences Map\", \"summary\": \"Follows the ripple effects two and three steps past the obvious result.\", \"when\": \"A change affects other people, other systems, or future you.\", \"output\": \"First order, second order, and third order effects, with the surprises called out.\", \"body\": \"Map the consequences of the decision below.\\n\\n1. First order: what happens immediately and directly.\\n2. Second order: what happens because of those first effects, including how people adapt or work around it.\\n3. Third order: what happens after that, including anything that quietly becomes permanent.\\n4. Mark which effects are hard to reverse.\\n5. Call out the effects most people would not see coming, and the one that would make me reconsider the decision.\\n\\nDecision:\\n[paste here]\"}, {\"id\": \"high-leverage\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Find the few changes worth the most\", \"original\": \"High-Leverage Audit\", \"summary\": \"Sorts everything you could do by payoff versus effort and tells you where to start.\", \"when\": \"You have too many possible improvements and limited time.\", \"output\": \"A ranked list by leverage, the top three to do now, and what to deliberately ignore.\", \"body\": \"Audit the situation below for leverage.\\n\\n1. List everything that could be improved.\\n2. For each, estimate the payoff and the effort, and flag anything that unlocks other improvements.\\n3. Rank by leverage, which is payoff divided by effort, with unlock value as a tiebreaker.\\n4. Give the top three to do now, with the first concrete action for each.\\n5. Give the list of things to deliberately ignore and say why they are not worth it right now.\\n\\nSituation:\\n[paste here]\"}, {\"id\": \"sop-builder\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Clean up my workflow and write the SOP\", \"original\": \"Workflow Optimizer & SOP Builder\", \"summary\": \"Streamlines a process, then writes the step by step document for it.\", \"when\": \"You do something repeatedly and it is all in your head.\", \"output\": \"The current process mapped, the improved version, and a usable SOP with owners and checks.\", \"body\": \"Turn the process below into a cleaner process and a usable SOP.\\n\\n1. Map the current process as numbered steps, including the steps I do without thinking.\\n2. Flag every step that is duplicated, manual for no reason, a bottleneck, or dependent on one person.\\n3. Give the improved process and say what changed and what it saves.\\n4. Write the SOP: purpose, when it runs, who owns each step, the exact steps, the inputs and outputs, and the check that confirms it worked.\\n5. Add a short troubleshooting section for the three most likely failures.\\n\\nProcess:\\n[paste here]\"}, {\"id\": \"first-principles\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Rebuild this from scratch\", \"original\": \"First Principles Rebuild\", \"summary\": \"Ignores how it is currently done and designs it fresh from what actually must be true.\", \"when\": \"The current setup grew by accident and patching it is not working.\", \"output\": \"The real requirements, a clean design built from them, and a migration path from what you have now.\", \"body\": \"Rebuild the system below from first principles.\\n\\n1. Strip it down: what is the actual goal, and what genuinely must be true for that goal to be met?\\n2. Separate real constraints from habits and legacy decisions that only exist because of history.\\n3. Design the clean version from those requirements as if nothing existed yet.\\n4. Compare the clean version to what I have now and list the differences that matter.\\n5. Give a realistic migration path in stages, with what to keep, what to cut, and what to run in parallel.\\n\\nSystem:\\n[paste here]\"}, {\"id\": \"cos-custom-instructions\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Write my custom instructions\", \"original\": \"Chief of Staff: Custom Instructions\", \"summary\": \"Builds the standing instructions that tell an AI how to work with you every time.\", \"when\": \"You keep repeating the same preferences in every new chat.\", \"output\": \"A ready to paste instruction block covering tone, format, defaults, and what to never do.\", \"body\": \"Write custom instructions for an AI assistant that works with me on an ongoing basis.\\n\\nCover:\\n1. How I want it to communicate: tone, length, directness, and whether it should challenge me.\\n2. Output defaults: formatting, structure, level of detail.\\n3. What context it should assume about my work and my priorities.\\n4. What it should always do without being asked.\\n5. What it should never do.\\n\\nRules: write it as a block I can paste directly into a settings field. Keep it under 300 words. No filler. Ask me up to five questions first if you need them to get this right.\\n\\nAbout me:\\n[paste here]\"}, {\"id\": \"cos-system-prompt\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Write a reusable system prompt\", \"original\": \"Chief of Staff: System Prompt\", \"summary\": \"Creates a full operating brief for a repeat use assistant or custom agent.\", \"when\": \"You are setting up a custom agent or a recurring job you want to behave the same way every time.\", \"output\": \"A structured system prompt with role, scope, rules, output format, and failure handling.\", \"body\": \"Write a system prompt for an assistant that will run this job repeatedly.\\n\\nStructure it as:\\n1. Role and objective in two sentences.\\n2. Scope: what is in, what is explicitly out.\\n3. Operating rules, numbered, specific enough to be testable.\\n4. Required output format with an example.\\n5. Failure handling: what to do when information is missing, ambiguous, or contradictory.\\n6. A short checklist it runs before returning anything.\\n\\nAvoid vague language like be helpful or use good judgment. Every rule must be checkable.\\n\\nThe job:\\n[paste here]\"}, {\"id\": \"cos-morning\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Give me a morning brief\", \"original\": \"Chief of Staff: Morning Brief\", \"summary\": \"A short start of day readout of what matters and what to do first.\", \"when\": \"Every morning, so the day does not start with you staring at a list.\", \"output\": \"Top priorities, deadlines, blockers, and one clear first action.\", \"body\": \"Give me a morning brief from the information below.\\n\\nFormat:\\n1. Top three priorities today, one line each, with why it is a priority.\\n2. Anything due or time sensitive today and tomorrow.\\n3. Blockers and what is waiting on someone else.\\n4. Anything that slipped from yesterday.\\n5. One clear first action to start with right now.\\n\\nKeep the whole thing under 200 words. No pep talk. No summary of the summary.\\n\\nInformation:\\n[paste here]\"}, {\"id\": \"cos-eod\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Wrap up my day\", \"original\": \"Chief of Staff: End-of-Day Wrap\", \"summary\": \"Closes the day out and sets tomorrow up so nothing gets lost overnight.\", \"when\": \"End of the work day, especially when you are switching between projects.\", \"output\": \"What got done, what moved, what is still open, and tomorrow first action.\", \"body\": \"Write an end of day wrap from the information below.\\n\\nFormat:\\n1. Done today, with anything worth recording for later.\\n2. Moved forward but not finished, and the exact next step for each.\\n3. Still open and why it did not move.\\n4. Anything now at risk because of today.\\n5. Tomorrow first action, one line.\\n\\nKeep it under 200 words. Be factual, no commentary on how the day went.\\n\\nInformation:\\n[paste here]\"}, {\"id\": \"cos-weekly\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Run my weekly review\", \"original\": \"Chief of Staff: Weekly Review\", \"summary\": \"A structured look back and look ahead so open loops do not pile up.\", \"when\": \"Once a week, same slot, ideally Friday afternoon or Sunday evening.\", \"output\": \"Wins, slips, open loops, things to drop, and next week three priorities.\", \"body\": \"Run a weekly review from the information below.\\n\\nFormat:\\n1. What actually got finished this week.\\n2. What slipped and the real reason, not the excuse.\\n3. Open loops, including anything waiting on someone else for more than a week.\\n4. What to drop or stop doing, with a reason for each.\\n5. Next week three priorities and the first action for each.\\n6. One pattern you noticed across the week that is worth fixing.\\n\\nBe direct about what is not working. Under 400 words.\\n\\nInformation:\\n[paste here]\"}, {\"id\": \"onedrive\", \"group\": \"workflow\", \"favorite\": false, \"title\": \"Plan my OneDrive folder overhaul\", \"original\": \"OneDrive Folder Overhaul (4 options: GPT, Claude, Hybrid, Universal)\", \"summary\": \"Designs a new folder structure and gives you four ways to run the cleanup.\", \"when\": \"Your cloud storage is a mess and you need a structure plus an actual migration plan.\", \"output\": \"A proposed folder tree, naming rules, and four execution options with trade offs.\", \"body\": \"Plan a full overhaul of my OneDrive folder structure.\\n\\n1. Ask me what I actually store, who else touches it, and what I need to find fastest. Maximum five questions.\\n2. Propose a folder tree no more than three levels deep, with a one line purpose for each top level folder.\\n3. Give naming rules for files and folders, including dates and versions, with examples.\\n4. Give a rule for what gets archived and what gets deleted.\\n5. Give four execution options and the trade offs of each: GPT driven, Claude driven, a hybrid of both, and a universal manual approach that works anywhere.\\n6. Give the migration order so I can do it in sessions without breaking active work.\\n\\nCurrent situation:\\n[paste here]\"}, {\"id\": \"shorten\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Make this shorter without losing the point\", \"original\": \"Shorten This\", \"summary\": \"Cuts the length down while keeping every fact and the original meaning.\", \"when\": \"A message, email, or paragraph is too long for the person who has to read it.\", \"output\": \"Three shorter versions plus a note on anything important that had to be dropped.\", \"body\": \"Shorten the text below.\\n\\nRules:\\n1. Keep every fact, number, name, date, and commitment. Do not invent anything.\\n2. Cut filler, repetition, throat clearing, and anything the reader already knows.\\n3. Keep the original tone and point of view.\\n4. Give me three versions: about half the original length, about a quarter, and a one sentence version.\\n5. Under the versions, list anything meaningful you had to drop so I can decide if it goes back in.\\n\\nText:\\n[paste here]\"}, {\"id\": \"expand\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Expand this into a fuller version\", \"original\": \"Expand This\", \"summary\": \"Takes rough notes or bullets and turns them into a complete, readable piece.\", \"when\": \"You have scraps and you need a real paragraph, email, or explanation.\", \"output\": \"A fuller version, with every assumption it had to make listed at the end.\", \"body\": \"Expand the text below into a complete version.\\n\\nRules:\\n1. Keep my meaning and my position. Do not soften or change the point I am making.\\n2. Add the detail, context, and connecting sentences a reader needs to follow it.\\n3. Do not invent facts, numbers, or quotes. If something is missing, write [need detail] and keep going.\\n4. Target length: [say how long you want it].\\n5. At the end, list every assumption you made.\\n\\nText:\\n[paste here]\"}, {\"id\": \"grammar-tone\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Fix the grammar and smooth the tone\", \"original\": \"Fix Grammar and Tone\", \"summary\": \"Corrects grammar, spelling, and punctuation, then evens out the tone without erasing your voice.\", \"when\": \"Right before you send something you typed fast.\", \"output\": \"A clean version, then a short list of what changed and why.\", \"body\": \"Proofread and lightly polish the text below.\\n\\nRules:\\n1. Fix grammar, spelling, punctuation, and tense.\\n2. Fix awkward or run on sentences, but keep my voice. Do not turn it into a corporate template.\\n3. Do not add new claims and do not remove facts.\\n4. Flag anything that reads as unclear, passive aggressive, or easy to misread.\\n5. Give me the corrected version first, then a short bullet list of what you changed and why.\\n\\nText:\\n[paste here]\"}, {\"id\": \"more-professional\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Make this sound more professional\", \"original\": \"Make It More Professional\", \"summary\": \"Rewrites it for a work audience without making it stiff, fake, or padded.\", \"when\": \"It is going to a client, a manager, or anyone outside your team.\", \"output\": \"A firm neutral version and a slightly warmer one, plus which to send.\", \"body\": \"Rewrite the text below so it reads as professional.\\n\\nRules:\\n1. Keep the same facts, asks, and deadlines.\\n2. Remove venting, sarcasm, and anything that could read as blame.\\n3. Stay direct. No corporate filler such as circling back or per my last email.\\n4. Keep it the same length or shorter.\\n5. Give me two versions, firm and neutral, then slightly warmer. End with one line on which you would send and why.\\n\\nText:\\n[paste here]\"}, {\"id\": \"more-friendly\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Make this sound friendlier\", \"original\": \"Make It More Friendly\", \"summary\": \"Warms up something that reads as cold or blunt, without weakening the ask.\", \"when\": \"You reread your message and it sounds harsher than you meant it.\", \"output\": \"A warmer version that still makes the request clearly.\", \"body\": \"Rewrite the text below so it sounds friendlier.\\n\\nRules:\\n1. Keep the request, the deadline, and every fact identical. Warmth must not soften the ask.\\n2. Remove anything that reads as annoyed, clipped, or accusatory.\\n3. No fake enthusiasm, no stacked exclamation points, no flattery.\\n4. Keep it short. Friendly does not mean longer.\\n5. Give me the rewrite, then one line naming what was making the original feel cold.\\n\\nText:\\n[paste here]\"}, {\"id\": \"change-tone\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Change the tone to whatever I ask for\", \"original\": \"Change the Tone\", \"summary\": \"Rewrites the same content in a tone you name, such as blunt, formal, casual, or apologetic.\", \"when\": \"The content is right but the delivery is wrong for who is reading it.\", \"output\": \"The same message in the tone you asked for, meaning unchanged.\", \"body\": \"Rewrite the text below in this tone: [name the tone, for example blunt, formal, casual, apologetic, urgent, neutral].\\n\\nRules:\\n1. Change the delivery only. Every fact, number, request, and deadline stays identical.\\n2. Do not change the length by more than about twenty percent unless I said to.\\n3. Do not add opinions I did not express.\\n4. If the tone I asked for would land badly with this audience, say so in one line first, then give me the rewrite anyway.\\n\\nText:\\n[paste here]\"}, {\"id\": \"translate\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Translate this and keep the meaning\", \"original\": \"Translate This\", \"summary\": \"Translates for meaning rather than word for word, and flags anything that does not carry over.\", \"when\": \"You need to send or read something in another language and cannot risk a literal mistranslation.\", \"output\": \"The translation, notes on idioms and formality, and a back translation to check it.\", \"body\": \"Translate the text below into [target language].\\n\\nRules:\\n1. Translate for meaning, not word for word. It must read naturally to a native speaker.\\n2. Keep the tone and the level of formality. Tell me which formality level you used and why.\\n3. Do not translate names, product names, or codes. Leave them exactly as they are.\\n4. List any idiom, joke, or phrase that does not carry over, with the closest equivalent you used.\\n5. After the translation, give me a plain English back translation so I can check it.\\n\\nText:\\n[paste here]\"}, {\"id\": \"compare\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Compare two things side by side\", \"original\": \"Compare and Contrast\", \"summary\": \"Puts the options in a table on the criteria that actually matter, then names a winner.\", \"when\": \"You are choosing between tools, vendors, plans, or approaches.\", \"output\": \"A comparison table, the differences that actually decide it, and a recommendation.\", \"body\": \"Compare the options below.\\n\\nRules:\\n1. First list the criteria that actually matter for my situation, and say why those and not others.\\n2. Build a table. One row per criterion, one column per option.\\n3. Mark anything you are not sure about as unverified rather than guessing.\\n4. Under the table, give me the three differences that would actually change the decision. Ignore the rest.\\n5. End with a recommendation, the strongest argument against it, and what would have to be true for the other option to win.\\n\\nOptions and my situation:\\n[paste here]\"}, {\"id\": \"pros-cons\", \"group\": \"quick\", \"favorite\": true, \"title\": \"List the pros and cons\", \"original\": \"Pros and Cons\", \"summary\": \"An honest two sided list, weighted by how much each point actually matters.\", \"when\": \"You are about to commit to something and want the downside spelled out.\", \"output\": \"Pros and cons with impact ratings, and the one factor that should decide it.\", \"body\": \"Give me the pros and cons of the decision below.\\n\\nRules:\\n1. List pros and cons separately, at least five each. If you cannot find five real ones, say so instead of padding.\\n2. Mark each point high, medium, or low impact. Impact decides this, not bullet count.\\n3. Include at least two cons that are easy to miss now and would only show up later.\\n4. Separate facts from assumptions and label the assumptions.\\n5. End with the one factor that should decide this, and what I would need to know to be confident.\\n\\nDecision:\\n[paste here]\"}, {\"id\": \"brainstorm\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Brainstorm a pile of ideas\", \"original\": \"Brainstorm Ideas\", \"summary\": \"Forces a wide list of options, including uncomfortable ones, then narrows it for you.\", \"when\": \"You are stuck, or your first idea is the only idea you have.\", \"output\": \"Fifteen ideas sorted from safe to bold, then the three worth acting on.\", \"body\": \"Brainstorm ideas for the situation below.\\n\\nRules:\\n1. Give me fifteen ideas. Do not stop at the obvious five.\\n2. Sort them into three groups: safe and easy, moderate effort, bold or uncomfortable.\\n3. At least three ideas must challenge an assumption I appear to be making. Name the assumption.\\n4. One line each. No essays.\\n5. Then pick the three with the best result to effort ratio and give one line of reasoning each.\\n\\nSituation:\\n[paste here]\"}, {\"id\": \"checklist\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Turn this into a checklist\", \"original\": \"Make a Checklist\", \"summary\": \"Converts messy instructions or notes into a checklist you can actually work through.\", \"when\": \"The process lives in your head or in a long document and you keep missing steps.\", \"output\": \"A checkbox list in the right order, with the usually forgotten items marked.\", \"body\": \"Turn the text below into a working checklist.\\n\\nRules:\\n1. One action per line, written as something I can physically do. Start each line with a verb.\\n2. Put them in the order they actually have to happen. Call out anything that must be finished before something else can start.\\n3. Mark the items that are commonly forgotten or skipped.\\n4. Add any obviously missing step and mark it as added by you.\\n5. Format as checkboxes. No commentary above or below the list.\\n\\nSource material:\\n[paste here]\"}, {\"id\": \"steps\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Turn this into numbered steps\", \"original\": \"Turn This Into Steps\", \"summary\": \"Rewrites an explanation as a procedure someone else could follow without asking you questions.\", \"when\": \"You need to hand a process to another person, or repeat it months from now.\", \"output\": \"Numbered steps with what to do and how to tell it worked.\", \"body\": \"Turn the text below into numbered steps.\\n\\nRules:\\n1. Number every step. One action per step.\\n2. For each step, say what to do and how to tell it worked.\\n3. List anything needed before starting: access, files, approvals, tools.\\n4. Flag the steps where people most often go wrong, and what to do when it goes wrong.\\n5. Keep the language plain enough for someone who has never done this before.\\n\\nSource material:\\n[paste here]\"}, {\"id\": \"action-items\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Pull out the action items\", \"original\": \"Extract Action Items\", \"summary\": \"Reads notes, an email chain, or a transcript and returns only what someone has to do.\", \"when\": \"After a meeting, or when a long thread ends and you are not sure what you owe anyone.\", \"output\": \"A table of tasks with owner, due date, and the implied commitments flagged.\", \"body\": \"Pull every action item out of the text below.\\n\\nRules:\\n1. Return a table: task, owner, due date, and the line it came from.\\n2. If an owner or date is not stated, write not stated. Do not guess.\\n3. Split the items into three groups: mine, other people's, and unassigned.\\n4. Include implied commitments such as I will look into that, and mark them as implied.\\n5. End with anything that was a decision rather than a task, listed separately.\\n\\nSource material:\\n[paste here]\"}, {\"id\": \"key-points\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Find the key points\", \"original\": \"Find the Key Points\", \"summary\": \"Strips a long document down to what matters and what it wants from you.\", \"when\": \"Someone sent you something long and you need the substance in a minute.\", \"output\": \"The main points, what is being asked of you, and what needs a decision.\", \"body\": \"Pull the key points out of the text below.\\n\\nRules:\\n1. Give me the five to seven points that actually matter. Ignore background and pleasantries.\\n2. Separately list anything being asked of me, with any deadline attached.\\n3. Separately list anything that needs a decision, and who has to make it.\\n4. Flag anything ambiguous, contradictory, or missing.\\n5. End with one sentence: if I only remember one thing from this, it is this.\\n\\nText:\\n[paste here]\"}, {\"id\": \"scannable\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Reformat this so it is easy to scan\", \"original\": \"Make It Easier to Scan\", \"summary\": \"Keeps the words and fixes the layout so the page can be read at a glance.\", \"when\": \"The content is fine but it is a wall of text.\", \"output\": \"The same information with headings, short blocks, and the key facts in bold.\", \"body\": \"Reformat the text below so it can be scanned in under a minute.\\n\\nRules:\\n1. Do not change the facts or the meaning. This is a layout job, not a rewrite.\\n2. Add short headings, break up long paragraphs, and use bullets where a list is hiding inside a paragraph.\\n3. Bold the numbers, dates, names, and decisions.\\n4. Move anything urgent or action related to the top.\\n5. Keep sentences short. If one runs past about twenty five words, split it.\\n\\nText:\\n[paste here]\"}, {\"id\": \"better-questions\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Give me better questions to ask\", \"original\": \"Ask Better Questions\", \"summary\": \"Turns a vague worry into the specific questions that would actually settle it.\", \"when\": \"Before a meeting, a vendor call, or a decision where you do not know what you do not know.\", \"output\": \"Ten ranked questions, including the ones people avoid asking.\", \"body\": \"Give me better questions to ask about the situation below.\\n\\nRules:\\n1. Write ten questions that would materially change my decision if answered.\\n2. Rank them by how much the answer would change what I do.\\n3. Include at least three questions that are uncomfortable or that people usually avoid asking.\\n4. For each question, add one line on what a bad or evasive answer would sound like.\\n5. End with the single question I should ask first, and why that one.\\n\\nSituation:\\n[paste here]\"}, {\"id\": \"find-weaknesses\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Find the weaknesses in this\", \"original\": \"Find Weaknesses\", \"summary\": \"A fast critical read that names the weak points and rates how bad each one is.\", \"when\": \"Before you send, publish, or commit to something you wrote.\", \"output\": \"A ranked list of weaknesses, each quoted, each with a fix.\", \"body\": \"Find the weaknesses in the material below.\\n\\nRules:\\n1. Be blunt. Do not open with what works well.\\n2. List every weakness: logic gaps, unsupported claims, vague language, missing information, wrong audience, weak structure.\\n3. Rank each one fatal, serious, or minor.\\n4. Quote the exact line for each one.\\n5. Give a specific fix for every fatal and serious item. Not advice, the actual replacement wording or the missing piece.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"improvements\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Suggest specific improvements\", \"original\": \"Suggest Improvements\", \"summary\": \"Gives concrete rewrites instead of vague advice like be clearer or add detail.\", \"when\": \"You have a solid draft and you want the version that is actually better.\", \"output\": \"Eight ranked changes, each with the exact replacement text.\", \"body\": \"Suggest improvements to the material below.\\n\\nRules:\\n1. Every suggestion must be specific enough to apply immediately. No advice such as be clearer or add more detail.\\n2. For each one: quote what is there now, give the replacement, and say in one line why it is better.\\n3. Limit it to the eight changes with the biggest effect, ranked.\\n4. Do not rewrite the whole thing. Surgical changes only.\\n5. At the end, say what is already working and should not be touched.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"exec-summary\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Write the executive summary\", \"original\": \"Make a Summary for an Executive\", \"summary\": \"Compresses a long document into the version a busy decision maker will actually read.\", \"when\": \"You are sending something up the chain and it has to land in thirty seconds.\", \"output\": \"Under 200 words: the ask, the numbers, the risk, and the decision needed.\", \"body\": \"Write an executive summary of the material below.\\n\\nRules:\\n1. Maximum 200 words for the summary itself.\\n2. Lead with the bottom line: what happened or what is being proposed, and what I am asking for.\\n3. Then four to six bullets covering the numbers, the timeline, the risk, and the decision needed.\\n4. No background, no history, no throat clearing. The reader gets thirty seconds.\\n5. End with a line labeled Decision needed, naming who decides and by when. If no decision is needed, say so.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"title-options\", \"group\": \"quick\", \"favorite\": true, \"title\": \"Give me title options\", \"original\": \"Generate a Title\", \"summary\": \"Generates titles or subject lines in several styles and tells you which one fits.\", \"when\": \"Naming a document, a page, an email subject line, or a file.\", \"output\": \"Ten accurate options in different styles, plus the recommended one.\", \"body\": \"Give me title options for the material below.\\n\\nRules:\\n1. Ten options. Vary the style: plain and descriptive, short and punchy, question form, and specific with a number or date in it.\\n2. Every title must be accurate to the content. No clickbait and no overpromising.\\n3. Keep them under sixty characters unless I say otherwise.\\n4. Where this will be used: [document, email subject, page name, file name].\\n5. End with your top pick and one line on why it fits that use.\\n\\nMaterial:\\n[paste here]\"}, {\"id\": \"disney\", \"group\": \"plan\", \"favorite\": false, \"title\": \"Grow a big idea, plan it, then test it\", \"original\": \"Disney Creative Strategy: Dreamer, Realist, Critic\", \"summary\": \"Walks you through Dreamer, Realist, and Critic modes, one at a time.\", \"when\": \"You have an exciting but vague idea and want the biggest version, a real plan, and an honest stress test.\", \"output\": \"A one sentence dream, a five step plan with a first step this week, and three weaknesses with fixes.\", \"body\": \"You are guiding me through the Disney Creative Strategy using three separate modes: Dreamer, Realist, and Critic.\\n\\nMy idea: [describe it in one or two sentences]\\n\\nTake me through one mode at a time. Ask one focused question at a time. Do not introduce the next mode until you have summarized the current mode and I confirm that it is complete.\\n\\nMODE 1: DREAMER\\nHelp me describe the biggest successful version of this idea, without budget limits, rules, logistics, or premature criticism. Ask what it looks and feels like when it works completely. Push me to make the vision bigger twice. Do not criticize, plan, or reduce the idea in this mode.\\n\\nBefore moving on, summarize the dream in one sentence and ask whether the Dreamer mode is complete.\\n\\nMODE 2: REALIST\\nHelp me turn the dream into something executable. Ask about the major steps, people, skills, money, resources, dependencies, timing, and the first action required. Do not expand the dream or criticize it in this mode.\\n\\nBefore moving on, summarize the proposed plan and ask whether the Realist mode is complete.\\n\\nMODE 3: CRITIC\\nPressure-test the plan. Ask separately:\\n1. What is missing?\\n2. What could go wrong?\\n3. Who might resist it, and why?\\nMake me answer each question. Record objections without arguing with them or returning to Dreamer mode.\\n\\nAfter all three modes, give me:\\n1. The biggest version of the dream in one sentence.\\n2. A five-step plan, including one first step I can complete this week.\\n3. The three biggest weaknesses identified, with one practical fix for each.\\n4. Which mode received my thinnest answers, based on specificity, depth, and number of ideas. Explain the evidence without claiming this proves a permanent personal pattern.\"}], \"T\": {\"summarize\": [\"summarize this\", \"give me the gist\", \"tldr\", \"too long to read\", \"what does this say\", \"sum up this email\", \"recap this article\", \"boil it down\", \"short version of this report\"], \"explain-simply\": [\"explain like im five\", \"eli5\", \"i dont understand this\", \"what does this mean\", \"break this down for a beginner\", \"explain in simple terms\", \"dumb it down\", \"new to this topic\", \"confusing jargon\"], \"rewrite-clarity\": [\"make this clearer\", \"reword this\", \"this is confusing to read\", \"clean up my writing\", \"rewrite this paragraph\", \"easier to read\", \"polish my draft\", \"clarify wording\"], \"research-challenge\": [\"look this up\", \"quick research\", \"is this true\", \"find out about\", \"research and push back\", \"check the facts quickly\", \"what do sources say\", \"google this for me\"], \"devils-advocate\": [\"argue against me\", \"play devils advocate\", \"poke holes in my idea\", \"tell me why im wrong\", \"challenge my opinion\", \"counter argument\", \"push back on me\", \"am i wrong\", \"disagree with me\"], \"red-team-research\": [\"research then disprove\", \"deep research\", \"thorough research with sources\", \"red team this\", \"stress test a claim\", \"find evidence against\", \"well sourced answer\", \"verify with research\"], \"sources-only\": [\"only use these documents\", \"answer from my files\", \"use only the pdf\", \"based on this document only\", \"no outside info\", \"quote from source\", \"answer from attached\", \"dont make things up\"], \"step-back\": [\"big picture\", \"zoom out\", \"what is the real question\", \"bigger context\", \"step back\", \"high level view\", \"am i asking the right question\", \"principles behind this\", \"bigpicture\"], \"self-ask\": [\"break down a complex question\", \"too many parts\", \"sub questions\", \"multi part question\", \"decompose problem\", \"complicated question step by step\"], \"t
